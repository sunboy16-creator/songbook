<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta name="theme-color" content="#eaf2fc"/>
<title>Sur&Strings — Songbook</title>
<style>
  :root{--bg:#eaf2fc;--surface:#fff;--surface2:#e1ecfa;--line:#cadcf1;--text:#132039;--muted:#5a6f8c;--chord:#dc2626;--section:#059669;--accent:#2563eb;--lyric-size:20px}
  [data-theme="dark"]{--bg:#0e1626;--surface:#152036;--surface2:#1d2b48;--line:#2c3d5e;--text:#e9f0fd;--muted:#90a6c9;--chord:#ff6b6b;--section:#34d399;--accent:#5b9bff}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:820px;margin:0 auto;min-height:100%}
  header{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px}
  .brand h1{font-family:Georgia,serif;font-size:21px;margin:0}
  .brand .n{color:var(--muted);font-size:12px}
  .btn{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 12px;font-size:14px;cursor:pointer}
  input.search{width:100%;margin-top:10px;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font-size:15px}
  .filters{display:flex;gap:8px;padding:10px 16px 2px}
  .filters select{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 10px;font-size:13.5px}
  main{padding:6px 16px 100px}
  .card{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 12px;margin:7px 0;cursor:pointer}
  .card .num{color:var(--muted);font-size:12px;width:26px;text-align:center}
  .card h3{margin:0;font-size:14.5px} .card .sub{margin-top:2px;font-size:11px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
  .tag{background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:0 6px} .tag.key{color:var(--chord)} .tag.capo{color:var(--section)}
  .reader{display:none;position:fixed;inset:0;background:var(--bg);z-index:40;flex-direction:column}
  .reader.open{display:flex}
  .rhead{padding:12px 16px;border-bottom:1px solid var(--line)}
  .rtop{display:flex;align-items:center;gap:10px}
  .iconbtn{background:var(--surface);border:1px solid var(--line);color:var(--text);width:38px;height:38px;border-radius:10px;font-size:17px;cursor:pointer;flex:none}
  .rboxes{display:flex;gap:12px;justify-content:space-between;margin-top:8px}
  .metabox{flex:0 1 auto;border:1px solid var(--line);border-radius:8px;padding:8px 13px;background:var(--surface);font-size:14px;line-height:1.6}
  .metabox .row{display:flex;gap:8px} .metabox .k{color:var(--muted)} .metabox .v{font-weight:600}
  .capolegend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;align-items:center;margin:10px 0 2px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
  .heart{background:none;border:none;font-size:19px;cursor:pointer;flex:none;padding:0 3px;line-height:1;opacity:.28}
  .heart.on{opacity:1}
  .heart.star{color:#e8b100}
  .heart.love{color:var(--chord)}
  .heart.star[disabled]{cursor:default}
  .capolegend .sep{color:var(--line)}
  .rtitle{font-family:Georgia,serif;font-size:24px;font-weight:700;text-align:center;color:var(--accent);margin:16px 0 6px}
  .rmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
  .stepper{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stepper button{background:none;border:none;color:var(--text);width:34px;height:34px;font-size:18px;cursor:pointer}
  .stepper .val{min-width:74px;text-align:center;font-size:13px} .stepper .val b{color:var(--chord)}
  .btn.reset{display:none}
  .sheet{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 18px 150px}
  .section-label{color:var(--section);font-weight:700;font-size:13px;letter-spacing:.6px;text-transform:uppercase;margin:18px 0 6px}
  .startline{color:var(--muted);font-style:italic;margin:10px 0 4px}
  .line{display:flex;flex-wrap:wrap;align-items:flex-end;margin:2px 0;line-height:1.15}
  .unit{display:flex;flex-direction:column;max-width:100%}
  .unit .chord{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--chord);font-weight:700;font-size:calc(var(--lyric-size)*.82);height:1.35em;white-space:pre}
  .unit .lyric{white-space:pre-wrap;overflow-wrap:break-word;font-size:var(--lyric-size)}
  .blank{height:calc(var(--lyric-size)*.7)}
  .transport{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--bg) 70%,transparent)}
  /* ---- perform (full-screen chords) mode ---- */
  .perfbar{display:none}
  .reader.perform .rhead,.reader.perform .transport{display:none}
  .reader.perform .sheet{padding:10px 14px 90px}
  .reader.perform .perfbar{display:flex;position:absolute;left:0;right:0;bottom:0;z-index:5;
    gap:10px;align-items:center;padding:8px 14px calc(8px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,var(--bg) 75%,transparent)}
  .perfbar .pbtn{background:var(--surface);border:1px solid var(--line);color:var(--text);
    border-radius:10px;height:40px;min-width:44px;font-size:15px;cursor:pointer;flex:none}
  .perfbar .play2{background:var(--accent);color:#fff;border:none;font-size:17px}
  .perfbar #pSpeed{flex:1;accent-color:var(--accent)}
  .transport .play{width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:20px;cursor:pointer;flex:none}
  .speed{flex:1;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px} .speed input{flex:1;accent-color:var(--accent)}
  .empty{color:var(--muted);text-align:center;padding:50px 20px}
</style>
</head>
<body data-theme="day">
<div class="wrap">
  <header>
    <div class="brand"><h1>Sur&amp;Strings</h1><span class="n" id="count"></span><span style="flex:1"></span>
      <button class="btn" id="wakeBtn" title="Keep screen awake">☀︎ Awake</button>
      <button class="btn" id="themeBtn">◑</button></div>
    <input class="search" id="search" placeholder="Search title, key, pattern…"/>
  </header>
  <div class="filters">
    <button class="btn" id="favFilter" title="Show favourites">All</button>
    <select id="familySel"><option value="">All families</option></select>
    <select id="patternSel"><option value="">All patterns</option></select>
  </div>
  <main id="list"></main>
</div>

<div class="reader" id="reader">
  <div class="rhead">
    <div class="rtop"><button class="iconbtn" id="backBtn">‹</button><span style="flex:1"></span>

      <button class="iconbtn" id="performBtn" title="Full-screen chords">⛶</button></div>
    <div class="rboxes"><div class="metabox" id="boxLeft"></div><div class="metabox" id="boxRight"></div></div>
    <div id="capoLegend"></div>
    <h2 id="rTitle" class="rtitle"></h2>
    <div class="rmeta">
      <div class="stepper"><button id="tDown">−</button><span class="val">Key <b id="rKey">–</b></span><button id="tUp">+</button></div>
      <button class="btn reset" id="resetKey">Reset</button>
    </div>
  </div>
  <div class="sheet" id="sheet"></div>
  <div class="transport"><button class="play" id="playBtn">▶</button>
    <div class="speed">🐢<input type="range" id="speed" min="1" max="100" value="35"/>🐇</div></div>
  <div class="perfbar" id="perfbar">
    <button class="pbtn" id="pSmaller" title="Smaller">A−</button>
    <button class="pbtn" id="pBigger" title="Larger">A+</button>
    <button class="pbtn play2" id="pPlay" title="Auto-scroll">▶</button>
    <input type="range" id="pSpeed" min="1" max="100" value="35" title="Scroll speed"/>
    <button class="pbtn" id="pExit" title="Exit full screen">✕</button>
  </div>
</div>

function parseSong(raw){

      else if(k==="capo")s.capo=v; else if(k==="tempo")s.tempo=v;

  [["Majors",0],["Minors",1],["Sharp majors",2],["Sharp minors",3]].forEach(([name,gi])=>{
    const items=fams.filter(f=>famBucket(f)[0]===gi).sort((a,b)=>famBucket(a)[1]-famBucket(b)[1]);
    if(items.length)html+=`<optgroup label="${name}">`+items.map(f=>`<option ${f===filter.family?"selected":""}>${f}</option>`).join("")+`</optgroup>`;});
  el("familySel").innerHTML=html;
  const pats=[...new Set(SONGS.map(s=>canonPattern(s.pattern)).filter(Boolean))].sort();
  el("patternSel").innerHTML='<option value="">All patterns</option>'+pats.map(p=>`<option ${p===filter.pattern?"selected":""}>${p}</option>`).join("");}
function esc(t){return(t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
/* local favourites (this device) */
const LKEY="ss_local_favs";
function localFavs(){try{return JSON.parse(localStorage.getItem(LKEY)||"[]")}catch(e){return[]}}
function isLocalFav(s){return localFavs().includes(String(s.num||s.title));}
function toggleLocalFav(s){const id=String(s.num||s.title);let a=localFavs();
  a=a.includes(id)?a.filter(x=>x!==id):a.concat([id]);localStorage.setItem(LKEY,JSON.stringify(a));}
function matches(s){const q=filter.q.toLowerCase();
  if(filter.fav==="global"&&!s.fav)return false;
  if(filter.fav==="local"&&!isLocalFav(s))return false;
  if(filter.family&&famOf(s)!==filter.family)return false;
  if(filter.pattern&&canonPattern(s.pattern)!==filter.pattern)return false;
  if(q&&!(`${s.title} ${s.key} ${s.family} ${s.pattern}`.toLowerCase().includes(q)))return false;return true;}
function renderList(){const list=el("list");list.innerHTML="";const rows=SONGS.filter(matches);
  el("count").textContent=SONGS.length+" songs"+(rows.length!==SONGS.length?" ("+rows.length+" shown)":"");
  if(!rows.length){list.innerHTML='<div class="empty">No songs match.</div>';return}
  rows.forEach((s)=>{const i=SONGS.indexOf(s);const card=document.createElement("div");card.className="card";
    card.innerHTML=`<div class="num">${s.num||""}</div><div style="flex:1"><h3>${esc(s.title)}</h3><div class="sub">
      ${s.key?`<span class="tag key">♪ ${esc(s.key)}</span>`:""}
      ${canonPattern(s.pattern)?`<span class="tag">${esc(canonPattern(s.pattern))}</span>`:""}
      ${s.capo?`<span class="tag capo">Capo ${esc(s.capo)}</span>`:""}</div></div>
      <button class="heart star ${s.fav?'on':''}" title="Set-list favourite (from Mac)" disabled>★</button>
      <button class="heart love ${isLocalFav(s)?'on':''}" title="My favourite on this device">♥</button>`;
    card.onclick=()=>openReader(i);
    card.querySelector(".love").onclick=(e)=>{e.stopPropagation();toggleLocalFav(s);renderList();};
    list.appendChild(card);});}
function capoSteps(capo){const m=(capo||"").match(/(\d+)/);return m?parseInt(m[1],10):0;}
function capoLegendHTML(song){
  const st=capoSteps(song.capo); if(!st) return "";
  const seen=[];
  for(const ln of song.lines){ if(!ln.units) continue;
    for(const u of ln.units){ const c=(u.chord||"").trim(); if(c && !seen.includes(c)) seen.push(c); } }
  if(!seen.length) return "";
  const famRoot=((song.family||song.key||"").match(/^([A-G][#b]?)/)||[])[1];
  const rootOf=c=>((c||"").match(/^([A-G][#b]?)/)||[])[1];
  if(famRoot && seen.some(c=>rootOf(c)===famRoot)) return "";
  const pairs=seen.map(shape=>{
    const family=transposeChord(shape,st,false);
    return `<span style="color:var(--section);font-weight:700">${esc(family)}</span>`
      +`<span style="color:var(--muted)">→</span>`
      +`<span style="color:var(--chord);font-weight:700">${esc(shape)}</span>`;});
  return `<div class="capolegend">${pairs.join('<span class="sep">·</span>')}</div>`;
}
function openReader(i){steps=0;stopScroll();curSong=parseSong(SONGS[i].cho);
  el("rTitle").textContent=(SONGS[i].num?SONGS[i].num+". ":"")+(curSong.title||SONGS[i].title||"Untitled");
  const row=(k,v)=>v?`<div class="row"><span class="k">${k} :-</span><span class="v">${esc(v)}</span></div>`:"";
  el("boxLeft").innerHTML=row("Family",curSong.family||curSong.key)+row("Pattern",curSong.pattern);
  el("boxRight").innerHTML=row("Scale",curSong.scale)+row("Capo",curSong.capo||"No Capo")+row("Tempo",curSong.tempo);
  el("capoLegend").innerHTML=capoLegendHTML(curSong);
  draw();el("reader").classList.add("open");el("sheet").scrollTop=0;}
function draw(){const k=renderSheet(el("sheet"),curSong,steps);el("rKey").textContent=k||"–";el("resetKey").style.display=steps?"inline-block":"none";}
function stopScroll(){if(autoT){cancelAnimationFrame(autoT);autoT=null}el("playBtn").textContent="▶";var pp=document.getElementById("pPlay");if(pp)pp.textContent="▶";}
function startScroll(){const sheet=el("sheet");el("playBtn").textContent="❚❚";var pp=document.getElementById("pPlay");if(pp)pp.textContent="❚❚";let acc=0,last=null;
  const step=(ts)=>{if(last==null)last=ts;const dt=(ts-last)/1000;last=ts;acc+=Number(el("speed").value)*0.9*dt;
    if(acc>=1){sheet.scrollTop+=Math.floor(acc);acc-=Math.floor(acc);}
    if(sheet.scrollTop+sheet.clientHeight>=sheet.scrollHeight-2){stopScroll();return}autoT=requestAnimationFrame(step);};
  autoT=requestAnimationFrame(step);}
el("search").oninput=e=>{filter.q=e.target.value;renderList()};
el("familySel").onchange=e=>{filter.family=e.target.value;renderList()};
el("patternSel").onchange=e=>{filter.pattern=e.target.value;renderList()};
/* ---------- keep screen awake (Wake Lock) ---------- */
let wakeLock=null, wakeOn=false;
const wakeBtns=()=>[document.getElementById("wakeBtn"),document.getElementById("wakeBtnR")].filter(Boolean);
function paintWake(){wakeBtns().forEach(b=>{const r=b.id==="wakeBtnR";
  b.textContent=wakeOn?(r?"☀︎✓":"☀︎ Awake ✓"):(r?"☀︎":"☀︎ Awake");
  b.classList.toggle("primary",wakeOn);});}
async function enableWake(){
  if(!("wakeLock" in navigator)){wakeBtns().forEach(b=>{b.textContent="✕";b.title="Keep-awake needs iOS 16.4+";});return false;}
  try{wakeLock=await navigator.wakeLock.request("screen");wakeOn=true;paintWake();
    wakeLock.addEventListener("release",()=>{wakeOn=false;paintWake();});return true;
  }catch(e){wakeBtns().forEach(b=>b.textContent="✕");return false;}
}
async function disableWake(){try{if(wakeLock){await wakeLock.release();wakeLock=null;}}catch(e){}wakeOn=false;paintWake();}
function toggleWake(){wakeOn?disableWake():enableWake();}
wakeBtns().forEach(b=>b.onclick=toggleWake);
document.addEventListener("visibilitychange",()=>{if(wakeOn && document.visibilityState==="visible") enableWake();});

/* ---------- perform (full-screen chords) mode ---------- */
function enterPerform(){el("reader").classList.add("perform");if(!wakeOn)enableWake();syncPlay();}
function exitPerform(){el("reader").classList.remove("perform");}
el("performBtn").onclick=enterPerform;
el("pExit").onclick=exitPerform;
el("pSmaller").onclick=()=>{fontSz-=2;applyFont();};
el("pBigger").onclick=()=>{fontSz+=2;applyFont();};
// keep the two speed sliders mirrored
el("pSpeed").oninput=()=>{el("speed").value=el("pSpeed").value;};
el("speed").addEventListener("input",()=>{el("pSpeed").value=el("speed").value;});
el("pPlay").onclick=()=>{autoT?stopScroll():startScroll();};
function syncPlay(){const p=autoT?"❚❚":"▶";el("pPlay").textContent=p;el("playBtn").textContent=p;}
el("themeBtn").onclick=()=>{const b=document.body;b.dataset.theme=b.dataset.theme==="dark"?"day":"dark";
  document.querySelector('meta[name=theme-color]').content=getComputedStyle(b).getPropertyValue('--bg').trim();};
el("backBtn").onclick=()=>{stopScroll();el("reader").classList.remove("open","perform")};
el("tUp").onclick=()=>{steps++;draw()};el("tDown").onclick=()=>{steps--;draw()};el("resetKey").onclick=()=>{steps=0;draw()};
el("playBtn").onclick=()=>autoT?stopScroll():startScroll();
let fontSz=20;
function applyFont(){fontSz=Math.max(12,Math.min(34,fontSz));document.documentElement.style.setProperty("--lyric-size",fontSz+"px");}
el("sizeDown").onclick=()=>{fontSz-=2;applyFont();};
el("sizeUp").onclick=()=>{fontSz+=2;applyFont();};
applyFont();
populateFilters();renderList();
</script>
</body>
</html>
